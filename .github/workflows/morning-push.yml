name: Morning Daily Verse Push

# Runs at the top of every hour (UTC). The sender picks out the subset of
# subscribers it's currently 7am (their chosen hour) for, then delivers via
# two transports:
#   - Web Push (browsers / PWA)          — `push:` rows in PartyKit
#   - APNs (native iOS App Store app)    — `apns:` rows in PartyKit
# Sender lives in verserain-web/scripts/send-morning-push.mjs.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the 7am gate and send now (test)'
        type: boolean
        default: false
      dry_run:
        description: 'Log what would send without sending'
        type: boolean
        default: false

concurrency:
  group: morning-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install sender dependencies
        working-directory: verserain-web
        run: npm install --no-save web-push@^3.6.7 jose@^5

      - name: Send morning daily-verse pushes
        working-directory: verserain-web
        env:
          PARTYKIT_HOST: https://verserain-party.hungry4grace.partykit.dev
          PARTYKIT_ADMIN_TOKEN: ${{ secrets.PARTYKIT_ADMIN_TOKEN }}
          DAILY_VERSE_HOST: https://www.verserain.com
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:hungry4grace@gmail.com
          # APNs (native iOS app). Until these three secrets are added the
          # sender logs "APNs: … skipping" and Web Push continues as before.
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_BUNDLE_ID: com.hopeofglory.verserain
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: node scripts/send-morning-push.mjs
