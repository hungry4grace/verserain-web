name: Upload Psalm narrations

# Pulls narrated Psalm recordings from Google Drive and registers them as the
# creator voice of the Psalms verse sets (PartyKit), credited to the narrator.
# Wraps verserain-web/scripts/upload-psalm-voices.mjs so it can run from
# GitHub instead of a laptop. The Drive files must be reachable by link
# ("Anyone with the link" on the file or its folder).
#
# Two ways to run it:
#   1. Actions → "Upload Psalm narrations" → Run workflow (inputs below).
#   2. Edit .github/psalm-voices/job.json and push it — the push runs the job
#      with the values in that file (handy when the dispatch API is not
#      available to the caller).
on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/psalm-voices/job.json'
  workflow_dispatch:
    inputs:
      files:
        description: 'Psalm=DriveFileId pairs, comma-separated (e.g. 1=1Guol…,23=1AbC…). Or use job.json with a public folder id.'
        required: true
        type: string
      version:
        description: 'Which sets get the recording: esv, kjv, niv or all'
        type: string
        default: esv
      narrator:
        description: 'Name shown as the reader'
        type: string
        default: Melody Hwang
      force:
        description: 'Replace a recording that already exists for that Psalm'
        type: boolean
        default: false
      dry_run:
        description: 'Download and convert only, do not upload'
        type: boolean
        default: false

concurrency:
  group: upload-psalm-voices
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install ffmpeg and gdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --user gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve job parameters
        id: job
        env:
          IN_FILES: ${{ inputs.files }}
          IN_VERSION: ${{ inputs.version }}
          IN_NARRATOR: ${{ inputs.narrator }}
          IN_FORCE: ${{ inputs.force }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=$IN_FILES" >> "$GITHUB_OUTPUT"
            echo "folder=" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            echo "version=${IN_VERSION:-esv}" >> "$GITHUB_OUTPUT"
            echo "narrator=${IN_NARRATOR:-Melody Hwang}" >> "$GITHUB_OUTPUT"
            echo "force=$([ "$IN_FORCE" = "true" ] && echo --force)" >> "$GITHUB_OUTPUT"
            echo "dry_run=$([ "$IN_DRY_RUN" = "true" ] && echo --dry-run)" >> "$GITHUB_OUTPUT"
          else
            J=.github/psalm-voices/job.json
            echo "files=$(jq -r '.files // ""' $J)" >> "$GITHUB_OUTPUT"
            echo "folder=$(jq -r '.folder // ""' $J)" >> "$GITHUB_OUTPUT"
            echo "only=$(jq -r '(.only // []) | map(tostring) | join(",")' $J)" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r '.version // "esv"' $J)" >> "$GITHUB_OUTPUT"
            echo "narrator=$(jq -r '.narrator // "Melody Hwang"' $J)" >> "$GITHUB_OUTPUT"
            echo "force=$([ "$(jq -r '.force // false' $J)" = "true" ] && echo --force)" >> "$GITHUB_OUTPUT"
            echo "dry_run=$([ "$(jq -r '.dry_run // false' $J)" = "true" ] && echo --dry-run)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Download recordings from Google Drive
        env:
          FILES: ${{ steps.job.outputs.files }}
          FOLDER: ${{ steps.job.outputs.folder }}
          ONLY: ${{ steps.job.outputs.only }}
        run: |
          mkdir -p psalms
          # A public folder: list it through Drive's embedded folder view (no
          # API key needed, no 50-file cap), keep Bible_19_Psalms_N.* entries.
          if [ -n "$FOLDER" ]; then
            FILES="$(python3 - "$FOLDER" "$ONLY" <<'PY'
          import re, sys, urllib.request
          folder, only = sys.argv[1], sys.argv[2]
          want = {int(x) for x in re.findall(r'\d+', only)} if only.strip() else None
          html = urllib.request.urlopen(f'https://drive.google.com/embeddedfolderview?id={folder}#list', timeout=60).read().decode('utf-8', 'ignore')
          pairs = re.findall(r'href="https://drive\.google\.com/file/d/([^/"]+)/view[^"]*"[^>]*>.*?<div class="flip-entry-title">([^<]+)</div>', html, re.S)
          out = []
          for fid, name in pairs:
              m = re.search(r'Psalms?[ _-]*(\d{1,3})(?!\d)', name, re.I)
              if not m: continue
              n = int(m.group(1))
              if want is not None and n not in want: continue
              out.append(f'{n}={fid}')
          sys.stderr.write(f'folder lists {len(pairs)} files, {len(out)} selected\n')
          print(','.join(out))
          PY
          )"
            echo "Selected: $FILES"
            [ -n "$FILES" ] || { echo "No matching Psalm files found in the folder"; exit 1; }
          fi
          # Drive throttles bursts of downloads ("many accesses"): retry each
          # file with growing pauses and keep going; failures are listed at the
          # end so a re-run (which skips what is already uploaded) can pick
          # them up.
          IFS=',' read -ra PAIRS <<< "$FILES"
          failed=""
          for pair in "${PAIRS[@]}"; do
            pair="$(echo "$pair" | tr -d '[:space:]')"
            [ -z "$pair" ] && continue
            n="${pair%%=*}"; id="${pair#*=}"
            out="psalms/Bible_19_Psalms_${n}.wav"
            echo "Psalm $n ← $id"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gdown --quiet "$id" -O "$out" && [ -s "$out" ]; then ok=1; break; fi
              rm -f "$out"
              echo "  attempt $attempt failed for Psalm $n — waiting $((attempt * 45))s"
              sleep $((attempt * 45))
            done
            if [ "$ok" = 1 ]; then echo "  ok ($(du -h "$out" | cut -f1))"; else failed="$failed $n"; fi
            sleep 2
          done
          echo "downloaded: $(ls psalms | wc -l) files"
          echo "download failures:${failed:- none}"

      - name: Upload to PartyKit
        working-directory: verserain-web
        env:
          VERSION: ${{ steps.job.outputs.version }}
          NARRATOR: ${{ steps.job.outputs.narrator }}
          FORCE: ${{ steps.job.outputs.force }}
          DRY_RUN: ${{ steps.job.outputs.dry_run }}
        run: node scripts/upload-psalm-voices.mjs ../psalms --version "$VERSION" --narrator "$NARRATOR" $FORCE $DRY_RUN
